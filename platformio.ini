[platformio]
default_envs = c3-test-no-oled

[env]
platform = platformio/espressif32@8.0.0
framework = arduino, espidf
board = warp_c3_supermini
platform_packages =
    platformio/framework-espidf@4.50505.0
    platformio/framework-arduinoespressif32@4.30312.261024
    platformio/toolchain-riscv32-esp@14.2.0+20260121
monitor_speed = 115200
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++2b -std=gnu++23
lib_deps = bblanchon/ArduinoJson@7.4.2
lib_ldf_mode = chain+
extra_scripts = pre:scripts/build_guard.py

[test]
custom_protected_build = 0
build_flags = -std=gnu++17 -DWARP_PROTECTED_BUILD=0 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
board_build.cmake_extra_args = -DWARP_PROFILE=test

[production]
custom_protected_build = 1
; Build artifacts only. Provisioning/signing/encryption belong to later stages.
build_flags = -std=gnu++17 -DWARP_PROTECTED_BUILD=1 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
board_build.cmake_extra_args = -DWARP_PROFILE=production

[oled]
lib_deps =
    ${env.lib_deps}
    olikraus/U8g2@2.36.17

[env:c3-test-no-oled]
extends = test
build_flags = ${test.build_flags} -DOLED_ENABLED=0

[env:c3-test-oled]
extends = test, oled
build_flags = ${test.build_flags} -DOLED_ENABLED=1

[env:c3-production-no-oled]
extends = production
build_flags = ${production.build_flags} -DOLED_ENABLED=0

[env:c3-production-oled]
extends = production, oled
build_flags = ${production.build_flags} -DOLED_ENABLED=1
